<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strona wyłączona</title>
<style>
  :root {
    --bg: #fff3c4;
    --ink: #2b2140;
    --plug: #e8453c;
    --wall: #ffd95e;
    --text: #2b2140;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1f1a33; --ink: #f3ecff; --wall: #3a2f5c; --text: #f3ecff; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; overflow: hidden;
  }
  h1 { font-size: clamp(2rem, 7vw, 4rem); margin: 8px 0; }
  p { font-size: clamp(1rem, 3vw, 1.3rem); max-width: 28ch; margin: 6px auto; }
  #msg { min-height: 1.6em; font-weight: bold; }
  button {
    margin-top: 18px; font: inherit; font-weight: bold; cursor: pointer;
    background: var(--plug); color: #fff; border: 3px solid var(--ink);
    border-radius: 999px; padding: 10px 22px;
    box-shadow: 0 5px 0 var(--ink);
  }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .scene { position: relative; width: min(340px, 90vw); height: 180px; margin-bottom: 10px; }
  .wall {
    position: absolute; right: 0; top: 20px; width: 90px; height: 120px;
    background: var(--wall); border: 4px solid var(--ink); border-radius: 14px;
  }
  .wall::before, .wall::after {
    content: ""; position: absolute; top: 40px; width: 10px; height: 26px;
    background: var(--ink); border-radius: 3px;
  }
  .wall::before { left: 24px; } .wall::after { right: 24px; }

  .plug { position: absolute; top: 60px; left: 0; width: 220px; height: 40px;
    animation: pull 4s ease-in-out infinite; }
  .cable { position: absolute; left: 0; top: 17px; width: 150px; height: 6px; background: var(--ink); border-radius: 3px; }
  .body { position: absolute; left: 140px; top: 0; width: 46px; height: 40px;
    background: var(--plug); border: 4px solid var(--ink); border-radius: 10px; }
  .prong { position: absolute; left: 184px; width: 28px; height: 8px; background: var(--ink); border-radius: 2px; }
  .p1 { top: 8px; } .p2 { top: 24px; }
  .face { position: absolute; left: 148px; top: 8px; font-size: 18px; color: #fff; line-height: 1; }

  .spark { position: absolute; right: 96px; top: 42px; font-size: 28px; opacity: 0;
    animation: spark 4s ease-in-out infinite; }

  @keyframes pull {
    0%, 20%   { transform: translateX(120px) rotate(0); }
    45%       { transform: translateX(0) rotate(-6deg); }
    55%       { transform: translateX(-6px) rotate(4deg); }
    65%, 90%  { transform: translateX(0) rotate(0); }
    100%      { transform: translateX(120px) rotate(0); }
  }
  @keyframes spark {
    0%, 38% { opacity: 0; transform: scale(.3); }
    44%     { opacity: 1; transform: scale(1.3) rotate(15deg); }
    55%, 100% { opacity: 0; transform: scale(.3); }
  }
  .wobble { animation: wob .5s; }
  @keyframes wob { 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }

  @media (prefers-reduced-motion: reduce) {
    .plug, .spark, .wobble { animation: none; }
    .plug { transform: translateX(0); }
  }
</style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="wall"></div>
    <div class="spark">⚡</div>
    <div class="plug">
      <div class="cable"></div>
      <div class="body"></div>
      <div class="face">x_x</div>
      <div class="prong p1"></div>
      <div class="prong p2"></div>
    </div>
  </div>

  <h1>Strona wyłączona</h1>
  <p>Ktoś wyciągnął wtyczkę. Podejrzewamy kota.</p>
  <p id="msg" aria-live="polite"></p>
  <button id="btn" type="button">Spróbuj włączyć</button>

<script>
  var texts = [
    "Próbowaliśmy wyłączyć i włączyć. Nie pomogło.",
    "Serwer poszedł na kawę. Wróci za chwilę.",
    "Błąd 404: motywacja nie znaleziona.",
    "Chomik w serwerowni biegnie szybciej, ale i tak nie wystarcza.",
    "Sprawdź, czy wtyczka jest w gniazdku. Ona sprawdziła.",
    "Strona jest na urlopie. Pozdrawia z plaży."
  ];
  var i = 0, msg = document.getElementById("msg"), btn = document.getElementById("btn");
  btn.addEventListener("click", function () {
    msg.textContent = texts[i++ % texts.length];
    document.body.classList.remove("wobble");
    void document.body.offsetWidth;
    document.body.classList.add("wobble");
  });
</script>
</body>
</html>
